<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./styles/global.css">
    <link rel="stylesheet" href="./styles/searchResults.css">
    <link rel="icon" type="image/x-icon" href="./images/icon.svg">
    <title>Kain't Decide?</title>
    <script src="./scripts/script.js" defer></script>
    <script type="module" src="./scripts/search.js" defer></script>
    <script type="module" src="./scripts/searchResults.js" defer></script>
</head>
<body>
    <!-- SIDEBAR -->
    <div id="sidebar">
        <ul id="sidebarLinks">
            <li id="home"><a href="index.html">Home</a></li>
            <li id="categoryBtn"><a href="#">Categories</a></li>
            <li id="bookmark"><a href="#">Bookmarks</a></li>
            <li id="about"><a href="about.html">About</a></li>
            <li id="contacts"><a href="#">Contact</a></li>
        </ul>
    </div>

    <!-- HEADER -->

    <header>
        <div id="header-left">
            <img src="./images/icon.svg" alt="icon">
            <h1>Kain't Decide</h1>
        </div>

        <div id="header-right">
            <form class="search" id="search-form" action="searchResults.html" method="get">
                <img class="vector" src="./images/search.svg" alt="Search">

                <input
                    type="text"
                    class="search-input"
                    name="q"
                    placeholder="Search for cuisines and dishes"
                >
            </form>
            <img class="vector" id="sidebar-btn" src="./images/sidebar.svg" alt="sidebar-button">
        </div>
    </header>

    <div id="content">
        <div id="search-label">
            <h2>Search Results for "<span id="search-query"></span>":</h2>
        </div>

        <div id="search-results-container">
            <div id="search-results-box"></div>
        </div>
    </div>
</body>
</html>
