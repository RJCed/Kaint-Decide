<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./styles/global.css">
    <link rel="stylesheet" href="./styles/style.css">
    <link rel="icon" type="image/x-icon" href="./images/icon.svg">
    <title>Kain't Decide?</title>
    <script src="./scripts/script.js" defer></script>
    <script type="module" src="./scripts/home.js" defer></script>
</head>
<body>
    <!-- SIDEBAR -->
    <div id="sidebar">
        <ul id="sidebarLinks">
            <li id="home"><a href="index.html">Home</a></li>
            <li id="categoryBtn"><a href="#">Categories</a></li>
            <li id="bookmark"><a href="#">Bookmarks</a></li>
            <li id="about"><a href="about.html">About</a></li>
            <li id="contacts"><a href="#">Contact</a></li>
        </ul>
    </div>

    <!-- HEADER -->
    
    <header>
        <div id="header-left">
            <img src="./images/icon.svg" alt="icon">
            <h1>Kain't Decide</h1>
        </div>

        <div id="header-right">
            <div class="search">
                <img class="vector" src="./images/search.svg" alt="Search">

                <input
                    type="text"
                    class="search-input"
                    placeholder="Search for cuisines and dishes"
                >
            </div>
            <img class="vector" id="sidebar-btn" src="./images/sidebar.svg" alt="sidebar-button">
        </div>
    </header>

    <!-- HERO -->
    <div id="hero">
        <h1>WHAT FOOD ARE YOU <br>CRAVING?</h1>
        <p>Discover easy, delicious, and simple recipe for every craving.</p>
    </div>


    <!-- Section -->
    <section id="categories">
        <div class="label-text">
            <h2>Categories</h2>
            <p>View All →</p>
        </div>

        <div id="category-container">
            <div class="category-box"><img src="./images/placeholder.jpg" alt="Category Image" class="catImg"></div>
            <div class="category-box"><img src="./images/placeholder.jpg" alt="Category Image" class="catImg"></div>
            <div class="category-box"><img src="./images/placeholder.jpg" alt="Category Image" class="catImg"></div>
            <div class="category-box"><img src="./images/placeholder.jpg" alt="Category Image" class="catImg"></div>
            <div class="category-box"><img src="./images/placeholder.jpg" alt="Category Image" class="catImg"></div>
            <div class="category-box"><img src="./images/placeholder.jpg" alt="Category Image" class="catImg"></div>
            <div class="category-box"><img src="./images/placeholder.jpg" alt="Category Image" class="catImg"></div>
            <div class="category-box"><img src="./images/placeholder.jpg" alt="Category Image" class="catImg"></div>
        </div>
    </section>

    <!-- Recipe gallery -->
    <section id="recipe-gallery">
        <div class="label-text">
            <h2>Recipe Gallery</h2>
            <p>View All →</p>
        </div>


        <div id="recipe-gallery-container">

            <article class="recipe-box" data-recipe-id="RECIPE_ID">
                <div class="recipe-image">
                    <img class="recipe-img"
                        src="./images/placeholder.jpg"
                        alt="Recipe image">

                    <button
                        class="bookmark-btn"
                        type="button"
                        aria-label="Bookmark recipe"
                        aria-pressed="false"
                    >
                        <svg viewBox="0 0 24 24" aria-hidden="true">
                            <path d="M12 2.8l2.8 5.7 6.3.9-4.55 4.43
                                    1.07 6.25L12 17.1l-5.62 2.95
                                    1.07-6.25L2.9 9.4l6.3-.9L12 2.8z"/>
                        </svg>
                    </button>
                </div>

                <div class="recipe-info">
                    <img src="./images/recipeIcon.svg" alt="">
                    <h2 class="recipe-name">Recipe Name</h2>
                </div>
            </article>

            <article class="recipe-box" data-recipe-id="RECIPE_ID">
                <div class="recipe-image">
                    <img class="recipe-img"
                        src="./images/placeholder.jpg"
                        alt="Recipe image">

                    <button
                        class="bookmark-btn"
                        type="button"
                        aria-label="Bookmark recipe"
                        aria-pressed="false"
                    >
                        <svg viewBox="0 0 24 24" aria-hidden="true">
                            <path d="M12 2.8l2.8 5.7 6.3.9-4.55 4.43
                                    1.07 6.25L12 17.1l-5.62 2.95
                                    1.07-6.25L2.9 9.4l6.3-.9L12 2.8z"/>
                        </svg>
                    </button>
                </div>

                <div class="recipe-info">
                    <img src="./images/recipeIcon.svg" alt="">
                    <h2 class="recipe-name">Recipe Name</h2>
                </div>
            </article>

            <article class="recipe-box" data-recipe-id="RECIPE_ID">
                <div class="recipe-image">
                    <img class="recipe-img"
                        src="./images/placeholder.jpg"
                        alt="Recipe image">

                    <button
                        class="bookmark-btn"
                        type="button"
                        aria-label="Bookmark recipe"
                        aria-pressed="false"
                    >
                        <svg viewBox="0 0 24 24" aria-hidden="true">
                            <path d="M12 2.8l2.8 5.7 6.3.9-4.55 4.43
                                    1.07 6.25L12 17.1l-5.62 2.95
                                    1.07-6.25L2.9 9.4l6.3-.9L12 2.8z"/>
                        </svg>
                    </button>
                </div>

                <div class="recipe-info">
                    <img src="./images/recipeIcon.svg" alt="">
                    <h2 class="recipe-name">Recipe Name</h2>
                </div>
            </article>

            <article class="recipe-box" data-recipe-id="RECIPE_ID">
                <div class="recipe-image">
                    <img class="recipe-img"
                        src="./images/placeholder.jpg"
                        alt="Recipe image">

                    <button
                        class="bookmark-btn"
                        type="button"
                        aria-label="Bookmark recipe"
                        aria-pressed="false"
                    >
                        <svg viewBox="0 0 24 24" aria-hidden="true">
                            <path d="M12 2.8l2.8 5.7 6.3.9-4.55 4.43
                                    1.07 6.25L12 17.1l-5.62 2.95
                                    1.07-6.25L2.9 9.4l6.3-.9L12 2.8z"/>
                        </svg>
                    </button>
                </div>

                <div class="recipe-info">
                    <img src="./images/recipeIcon.svg" alt="">
                    <h2 class="recipe-name">Recipe Name</h2>
                </div>
            </article>

        </div>


    </section>
</body>
</html>
