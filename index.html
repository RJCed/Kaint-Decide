<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./styles/global.css">
    <link rel="stylesheet" href="./styles/style.css">
    <link rel="icon" type="image/x-icon" href="./images/icon.svg">
    <title>Kain't Decide?</title>
</head>
<body>
    <!-- HEADER -->
    
    <header>
        <div id="header-left">
            <img src="./images/icon.svg" alt="icon">
            <h1>Kain't Decide</h1>
        </div>

        <div id="header-right">
            <div class="search">
                <img class="vector" src="./images/search.svg" alt="Search">

                <input
                    type="text"
                    class="search-input"
                    placeholder="Search for cuisines and dishes"
                >
            </div>
            <img class="vector" id="sidebar-btn" src="./images/sidebar.svg" alt="sidebar-button">
        </div>
    </header>

    <!-- HERO -->
    <div id="hero">
        <h1>WHAT FOOD ARE YOU <br>CRAVING?</h1>
        <p>Discover easy, delicious, and simple recipe for every craving.</p>
    </div>


    <!-- Section -->
    <section id="categories">
        <div class="label-text">
            <h2>Categories</h2>
            <p>View All →</p>
        </div>

        <div id="category-container">
            <div class="category-box"></div>
            <div class="category-box"></div>
            <div class="category-box"></div>
            <div class="category-box"></div>
            <div class="category-box"></div>
            <div class="category-box"></div>
            <div class="category-box"></div>
        </div>
    </section>

    <!-- Recipe gallery -->
    <section id="recipe-gallary">
        <div class="label-text">
            <h2>Categories</h2>
            <p>View All →</p>
        </div>

        <div id="recipe-gallary-container">
            <div class="recipe-box"></div>
            <div class="recipe-box"></div>
            <div class="recipe-box"></div>
            <div class="recipe-box"></div>
        </div>
    </section>

    <script src="./script.js"></script>
</body>
</html>
